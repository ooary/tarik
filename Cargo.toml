[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/agent-protocol",
  "crates/tarik-mcp",
  "crates/engine-protocol",
  "crates/engine-client",
  "engines/duckdb",
]

# Normal development builds only the desktop app and its small protocol/client
# crates. The DuckDB engine adapter must be built explicitly.
default-members = [
  "src-tauri",
  "crates/agent-protocol",
  "crates/tarik-mcp",
  "crates/engine-protocol",
  "crates/engine-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Tarik contributors"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.dev-fast]
inherits = "release"
debug = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
zeroize = "1.9"
getrandom = "0.3"
interprocess = "2.4"
tokio = "1"
rmcp = { version = "3.3", default-features = false }
schemars = "1"
sqlparser = { version = "0.62", features = ["visitor"] }
libc = "0.2"
widestring = "1.2"
duckdb = { version = "~1.10505.0" }
