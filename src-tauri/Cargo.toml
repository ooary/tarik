[package]
name = "tarik"
version = "0.1.0"
description = "A local-first desktop SQL workbench"
authors = ["Tarik contributors"]
license = "MIT"
homepage = "https://github.com/tarik-desktop/tarik"
repository = "https://github.com/tarik-desktop/tarik"
edition = "2021"
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tarik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tarik-agent-protocol = { path = "../crates/agent-protocol" }
tarik-engine-client = { path = "../crates/engine-client" }
tarik-engine-protocol = { path = "../crates/engine-protocol" }
base64.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
getrandom.workspace = true
interprocess.workspace = true
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_WindowsProgramming",
] }
