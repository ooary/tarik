[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[build]
# No rustc-wrapper: Cargo incremental is the fast warm path and mold handles
# the expensive link step. sccache stays available but unwrapped.
# jobs = 4

[env]
# Engine adapters link the official prebuilt DuckDB library instead of
# compiling bundled C++. Only the tarik-engine-duckdb graph uses this.
DUCKDB_DOWNLOAD_LIB = "1"
