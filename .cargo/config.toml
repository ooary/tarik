[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[build]
# No rustc-wrapper here: Cargo incremental is the fast warm path and
# mold handles the expensive link step. Keep sccache disabled for the
# hot loop because wrapping rustc here invalidated the previous target/.
# jobs = 4
